zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 5a6b54fce3434595aa336c83aaaae4c1
      name: Yoda
  templates:
    - uuid: 32deae7638754871af7cd11fca39e17a
      template: 'Yoda 2.0 generic'
      name: 'Yoda 2.0 generic'
      description: 'Algemeen template voor Yoda 2.0 en hoger'
      groups:
        - name: Yoda
      items:
        - uuid: 75d4cd5eb51d40a4be708bb6fd4bb7d5
          name: yoda.dailyrodslogerrors
          type: ZABBIX_ACTIVE
          key: yoda.dailyrodslogerrors
          delay: 15m
          description: 'Returns the number of lines with ERROR in the rodsLog of the current day.'
          timeout: 20s
          tags:
            - tag: Application
              value: Yoda
        - uuid: 673dc0e97ca7461497456afc6d8b752e
          name: yoda.hourlyrodslogerrors
          type: ZABBIX_ACTIVE
          key: yoda.hourlyrodslogerrors
          delay: 5m
          units: yoda.hourlyrodslogerrors
          description: 'Returns the number of ERROR lines in the rodsLog of the current hour.'
          timeout: 20s
          tags:
            - tag: Application
              value: Yoda
          triggers:
            - uuid: 1cd1020261194fa3b6928ef1b4488949
              expression: 'last(/Yoda 2.0 generic/yoda.hourlyrodslogerrors)>1000'
              name: 'Hourly rodslog errors exceeds 1000 errors on {HOST.NAME}'
              priority: WARNING
              manual_close: 'YES'
              tags:
                - tag: Application
                  value: Yoda
        - uuid: ae9477c7f419441a867883d989e09dd9
          name: 'iRODS is available'
          type: ZABBIX_ACTIVE
          key: yoda.irodsavailable
          timeout: 10s
          triggers:
            - uuid: 24ff70e1f7434bb9a2f486da00663c36
              expression: 'last(/Yoda 2.0 generic/yoda.irodsavailable,#1)<>0'
              name: 'iRODS is not available'
              priority: HIGH
        - uuid: 54be8841c44a462aa745c7ac6f3dc133
          name: yoda.killedprocesses.count
          type: ZABBIX_ACTIVE
          key: yoda.killedprocesses.count
          delay: 5m
          description: 'Returns the number of lines with "Killed process" in /var/lib/messages of the current day'
          timeout: 20s
          tags:
            - tag: Application
              value: Yoda
          triggers:
            - uuid: 9af4c39209fc4fb897732e1fa7258a80
              expression: 'last(/Yoda 2.0 generic/yoda.killedprocesses.count)>0'
              name: 'process was killed due to lack of memory on {HOST.NAME}'
              priority: HIGH
              manual_close: 'YES'
              tags:
                - tag: Application
                  value: Yoda
        - uuid: 8d2953624b9c469288fb467161013a18
          name: 'Number of resources with inaccessible vault directories'
          type: ZABBIX_ACTIVE
          key: yoda.resourcemountpoints
          delay: 5m
          timeout: 30s
          triggers:
            - uuid: 5d2d2204ae0f4385a2d30c27d7f19359
              expression: 'last(/Yoda 2.0 generic/yoda.resourcemountpoints,#1)>0'
              name: 'Some iRODS vault directories are not accessible'
              priority: HIGH
